groups:
  - name: bookstack_alerts
    rules:
    # High CPU usage
    - alert: HighCPUUsage
      expr: rate(process_cpu_seconds_total[5m]) * 100 > 80
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage detected"
        description: "CPU usage is above 80% for more than 2 minutes"

    # High memory usage
    - alert: HighMemoryUsage
      expr: (jvm_memory_used_bytes / jvm_memory_max_bytes) * 100 > 85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage detected"
        description: "JVM memory usage is above 85%"

    # Service down
    - alert: ServiceDown
      expr: up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Service is down"
        description: "{{ $labels.job }} service is down"

    # High database connections
    - alert: HighDatabaseConnections
      expr: hikaricp_connections_active > 8
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: "High database connection usage"
        description: "Active database connections: {{ $value }}"

    # High HTTP error rate
    - alert: HighHTTPErrorRate
      expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "High HTTP 5xx error rate"
        description: "HTTP 5xx error rate is {{ $value }} requests/second"