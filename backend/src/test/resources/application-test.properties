# Use PostgreSQL for CI/CD (similar to production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookstack_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:test_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Enable auth for E2E tests
bookstack.auth.enabled=true

# JWT settings for tests
jwt.secret=${JWT_SECRET:testSecretKeyForE2ETestingMustBeAtLeast256Bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.bookstack=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Rate limiting disabled for tests
rate.limit.enabled=false

# Disable mock data loading in tests
load.mock.data=false